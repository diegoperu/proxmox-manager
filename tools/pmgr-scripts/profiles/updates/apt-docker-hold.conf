// Gestito da ProxmoxManager: VM con Docker (rilevato da pmgr-vm-apply, modulo updates).
// Gli aggiornamenti di sicurezza automatici restano attivi per tutto il sistema, ma questi pacchetti NON si aggiornano da soli:
// aggiornare docker, containerd o runc riavvia il demone e puo' interrompere i contenitori in esecuzione (e i servizi di Swarm).
// Li aggiorna il gruppo quando vuole (apt upgrade), scegliendo il momento.
Unattended-Upgrade::Package-Blacklist {
        "docker.*";
        "containerd.*";
        "runc$";
};
