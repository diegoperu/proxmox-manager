// Gestito da ProxmoxManager: VM con scheda NVIDIA (rilevata da pmgr-vm-apply, modulo updates).
// Gli aggiornamenti di sicurezza automatici restano attivi per tutto il sistema, ma questi pacchetti NON si aggiornano da soli:
//  - kernel: senza il modulo NVIDIA corrispondente, al riavvio successivo la GPU non parte;
//  - stack NVIDIA e CUDA: aggiornare le librerie senza ricaricare il modulo del kernel da' "Driver/library version mismatch"
//    e CUDA smette di funzionare finche' non si riavvia;
//  - docker e containerd: l'aggiornamento riavvia il demone e uccide i contenitori in esecuzione;
//  - slurm e munge: le versioni devono restare coerenti con il resto del cluster di calcolo.
// Li aggiorna il gruppo quando vuole (apt upgrade); al login un avviso dice quanti sono in attesa.
Unattended-Upgrade::Package-Blacklist {
        "linux-image-.*";
        "linux-headers-.*";
        "linux-modules-.*";
        "linux-tools-.*";
        "linux-cloud-tools-.*";
        "linux-generic.*";
        "linux-virtual.*";
        "nvidia-.*";
        "libnvidia-.*";
        "xserver-xorg-video-nvidia-.*";
        "cuda-.*";
        "libcudnn.*";
        "libnccl.*";
        "docker.*";
        "containerd.*";
        "slurm.*";
        "libslurm.*";
        "munge$";
        "libmunge.*";
};
// Dopo ogni giro di apt si aggiorna la nota mostrata al login (pmgr-gpu-note)
DPkg::Post-Invoke { "/usr/local/sbin/pmgr-gpu-note --update-flag >/dev/null 2>&1 || true"; };
APT::Update::Post-Invoke-Success { "/usr/local/sbin/pmgr-gpu-note --update-flag >/dev/null 2>&1 || true"; };
