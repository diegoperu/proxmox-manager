// Gestito da ProxmoxManager (snippet cloud-init): aggiornamenti di SICUREZZA automatici, senza riavvio.
// Letto dopo 20auto-upgrades e 50unattended-upgrades: i valori qui sotto prevalgono.
// "always": ogni esecuzione dei timer (due volte al giorno) controlla e installa, senza saltare per il
// marcatore giornaliero. Gli orari sono nei file dei timer in /etc/systemd/system/apt-daily*.timer.d/.
// Alcune immagini (container, minimali) hanno APT::Periodic::Enable "0", che spegne in silenzio TUTTI i giri automatici.
APT::Periodic::Enable "1";
APT::Periodic::Update-Package-Lists "always";
APT::Periodic::Unattended-Upgrade "always";
#clear Unattended-Upgrade::Allowed-Origins;
Unattended-Upgrade::Allowed-Origins {
        "${distro_id}:${distro_codename}-security";
        "${distro_id}ESMApps:${distro_codename}-apps-security";
        "${distro_id}ESM:${distro_codename}-infra-security";
};
Unattended-Upgrade::Automatic-Reboot "false";
DPkg::Post-Invoke { "/usr/local/sbin/pmgr-reboot-check --update-flag >/dev/null 2>&1 || true"; };
