# Release of the static linux/amd64 binary (ROADMAP 24, part 2, D134).
# Trigger: pushing a tag vYYYY.MM.DD[.N] that points to a commit already on main.
# The binary is built in a pinned Alpine/musl container (fully static, runs on any Linux x86-64),
# tested, checksummed and attested (SLSA build provenance, verifiable with `gh attestation verify`).
# No secret is used. The ed25519 signature of SHA256SUMS is made offline, on the maintainer's workstation, by
# tools/release.sh (which creates the tag, waits for this workflow, verifies, signs and uploads SHA256SUMS.sig):
# the signing key is never available to GitHub.
name: release

on:
  push:
    tags:
      - 'v[0-9][0-9][0-9][0-9].[0-9][0-9].[0-9][0-9]*'

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write      # create the release and upload the assets
      id-token: write      # sign the provenance attestation (Sigstore)
      attestations: write  # store the attestation
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: The tag must point to a commit that is on main
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::the tag does not point to a commit on main"
            exit 1
          fi

      - name: Test and build the static binary
        env:
          COMMIT: ${{ github.sha }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          date_iso=$(git log -1 --format=%cI "$COMMIT")
          mkdir -p dist
          docker run --rm \
            -e COMMIT="$COMMIT" -e DATE="$date_iso" \
            -v "$PWD":/src -w /src \
            docker.io/library/golang@sha256:383395b794dffa5b53012a212365d40c8e37109a626ca30d6151c8348d380b5f \
            sh -euxc '
              apk add --no-cache gcc musl-dev nodejs git >/dev/null
              git config --global --add safe.directory /src
              go vet ./...
              go test ./...
              CGO_ENABLED=1 go build -buildvcs=false -trimpath \
                -tags "netgo osusergo sqlite_omit_load_extension" \
                -ldflags="-s -w -linkmode external -extldflags -static \
                  -X proxmox-manager/internal/buildinfo.Commit=$COMMIT \
                  -X proxmox-manager/internal/buildinfo.Date=$DATE \
                  -X proxmox-manager/internal/buildinfo.Dirty=false" \
                -o dist/proxmox-manager-linux-amd64 ./cmd/server/
            '
          cd dist
          # The binary must be static and must report the commit it was built from.
          if ldd proxmox-manager-linux-amd64 >/dev/null 2>&1; then
            echo "::error::the binary is not static"; exit 1
          fi
          sha256sum proxmox-manager-linux-amd64 > SHA256SUMS
          cat SHA256SUMS

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/proxmox-manager-linux-amd64

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh release create "$TAG" \
            dist/proxmox-manager-linux-amd64 dist/SHA256SUMS \
            --title "$TAG" --generate-notes --verify-tag
